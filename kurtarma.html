<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Acil Veri Kurtarma</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 2rem; }
        .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #333; }
        button { background: #007bff; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .danger { background: #dc3545; }
        .danger:hover { background: #a71d2a; }
    </style>
</head>
<body>
    <h1>Acil Veri Kurtarma Aracı</h1>
    <p>Sistemde yaşanan bir geri alma (rollback) hatası nedeniyle verileriniz sıfırlanmış olabilir. Tarayıcınızda otomatik olarak alınan yerel yedekleri aşağıda görebilirsiniz.</p>
    
    <div id="backup-list">
        <p>Yedekler aranıyor...</p>
    </div>

    <script>
        const list = document.getElementById('backup-list');
        let html = '';
        let found = false;

        const checkBackup = (key, label) => {
            const data = localStorage.getItem(key);
            if (data) {
                found = true;
                const parsed = JSON.parse(data);
                const size = (data.length / 1024).toFixed(2);
                const date = parsed.lastUpdated ? new Date(parsed.lastUpdated).toLocaleString('tr-TR') : 'Bilinmeyen Tarih';
                
                let hisseCount = parsed.ekstre ? parsed.ekstre.length : 0;
                let notCount = parsed.hisseNotlari ? Object.keys(parsed.hisseNotlari).length : 0;

                html += '<div class="card">' +
                        '<h3>' + label + ' (' + key + ')</h3>' +
                        '<p><strong>Tarih:</strong> ' + date + '</p>' +
                        '<p><strong>Boyut:</strong> ' + size + ' KB</p>' +
                        '<p><strong>İçerik:</strong> ' + hisseCount + ' işlem, ' + notCount + ' özel not/video içeriyor.</p>' +
                        '<button onclick="restore(\'' + key + '\')">Bu Yedeği Geri Yükle</button>' +
                    '</div>';
            }
        };

        // Eski sistem yedekleri
        for(let i=1; i<=4; i++) {
            checkBackup('borsa_app_data_backup_' + i, 'Otomatik Yedek ' + i);
        }
        
        // Yeni sistem yedekleri (tarihli)
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('borsa_app_backup_20')) {
                checkBackup(key, 'Günlük Yedek (' + key.replace('borsa_app_backup_', '') + ')');
            }
        }

        if (!found) {
            html = '<div class="card" style="border-color: #dc3545;"><p>Tarayıcıda hiçbir yedek bulunamadı. Veriler tamamen silinmiş olabilir.</p></div>';
        }

        list.innerHTML = html;

        window.restore = (key) => {
            if (confirm(key + ' yedeğini geri yüklemek istediğinize emin misiniz? Mevcut boş verilerin üzerine yazılacaktır.')) {
                const data = localStorage.getItem(key);
                localStorage.setItem('borsa_app_data', data);
                alert('Yedek başarıyla geri yüklendi! Lütfen ana uygulamayı (index.html) açın ve sayfayı yenileyin.');
            }
        };
    </script>
</body>
</html>
